<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

 body {
    margin: 0;
    background-color:rgb(80, 80, 114); 
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

#container {
    background: rgb(201, 197, 197);
    padding: 30px 40px;
    width: 320px;
}

#inner {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input, select {
    padding: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.2s;
}

h3 {
    text-align: center;
    color: #2e4160;
    min-height: 24px;
}
button {
    padding: 10px;
    border: none;
    font-size: 14px;
    cursor: pointer;
}


#cl {
    background-color: #4e5e7a;
    color: white;
}

#clear {
    background-color: #f44336;
    color: white;
}


</style>

<body>
    <div id="container">

        <div id="inner">
            <span>First</span>
            <input type="text" name="" id="one"> <br><br>

            <span>Operation</span>

            <select name="" id="op">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            
            
            <br><br>
            <span>Second</span> <input type="text" name="" id="two"><br><br>
            <h3 id="res"></h3>

            <button id="cl">Click</button>
            <button id="clear">Clear</button>
        </div>


    </div>

</body>
<script>
    let one = document.getElementById("one")
    let two = document.getElementById("two")
    let res = document.getElementById("res")
    let ops = document.getElementById("op")
    let Click = document.getElementById("cl")

    Click.addEventListener("click", () => {

        let a = parseInt(one.value);
        let b = parseInt(two.value);

        let op = ops.value;
        let ans;

        if (op === "+") {
            ans = a + b;
        } else if (op === "-") {
            ans = a - b;
        } else if (op === "*") {
            ans = a * b;
        } else if (op === "/") {
            ans = b !== 0 ? a / b : "Cannot divide by 0";
        }

        res.innerHTML = ans
    })


    let clear = document.getElementById("clear")

    clear.addEventListener("click", () => {

        res.innerHTML = ""
        one.value = ""
        two.value = ""
    })
</script>

</html>
